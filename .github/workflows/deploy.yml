name: Deploy to Server

on:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            if [ -d /home/hcs/citypostbot ]; then
              cd /home/hcs/citypostbot
              git fetch origin
              git checkout $BRANCH
              git pull origin $BRANCH
            else
              git clone https://github.com/oksiomas-cpu/citypostbot-vercel.git /home/hcs/citypostbot
              cd /home/hcs/citypostbot
              git checkout $BRANCH
            fi
            sudo systemctl restart citypostbot
            echo "Bot restarted OK on branch $BRANCH"
